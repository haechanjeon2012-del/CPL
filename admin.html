<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CPL 관리자</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
        }

        .admin-wrap {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .login-box {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.1);
        }

        .login-box h1 {
            margin-top: 0;
        }

        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #071a3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn:hover {
            opacity: .9;
        }

        .error {
            display: none;
            color: #d32f2f;
            margin-top: 12px;
        }

        #admin-panel {
            display: none;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .admin-header button {
            width: auto;
            padding: 10px 18px;
            background: #c62828;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e2e5e9;
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .admin-card p {
            color: #666;
        }

        .menu-btn {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #1769e8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .notice {
            margin-top: 25px;
            padding: 16px;
            background: #fff8e1;
            border-radius: 10px;
            color: #795548;
        }

        @media (max-width: 700px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-header button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     로그인
========================= -->

<div id="login-screen" class="login-box">

    <h1>🔐 CPL 관리자</h1>

    <p>
        관리자만 이용할 수 있습니다.
    </p>

    <input
        id="admin-password"
        class="admin-input"
        type="password"
        placeholder="관리자 비밀번호"
        autocomplete="off"
    >

    <button
        id="login-button"
        class="admin-btn"
        type="button"
    >
        로그인
    </button>

    <div id="login-error" class="error">
        비밀번호가 올바르지 않습니다.
    </div>

</div>


<!-- =========================
     관리자 메뉴
========================= -->

<main id="admin-panel">

    <div class="admin-wrap">

        <div class="admin-header">

            <div>
                <h1>⚾ CPL 관리자 센터</h1>
                <p>천중 프리미어리그 2026</p>
            </div>

            <button
                id="logout-button"
                class="admin-btn"
                type="button"
            >
                로그아웃
            </button>

        </div>


        <div class="admin-grid">

            <!-- 경기 -->

            <div class="admin-card">

                <h2>⚾ 경기 결과</h2>

                <p>
                    경기 결과와 점수를 관리합니다.
                </p>

                <button
                    class="menu-btn"
                    type="button"
                    onclick="openAdminMenu('경기 결과')"
                >
                    경기 관리
                </button>

            </div>


            <!-- 일정 -->

            <div class="admin-card">

                <h2>📅 일정</h2>

                <p>
                    경기 일정과 대진을 관리합니다.
                </p>

                <button
                    class="menu-btn"
                    type="button"
                    onclick="openAdminMenu('일정')"
                >
                    일정 관리
                </button>

            </div>


            <!-- 뉴스 -->

            <div class="admin-card">

                <h2>📰 뉴스</h2>

                <p>
                    CPL 뉴스와 공지를 관리합니다.
                </p>

                <button
                    class="menu-btn"
                    type="button"
                    onclick="openAdminMenu('뉴스')"
                >
                    뉴스 관리
                </button>

            </div>


            <!-- 팀 -->

            <div class="admin-card">

                <h2>👥 팀 정보</h2>

                <p>
                    팀 이름과 정보를 관리합니다.
                </p>

                <button
                    class="menu-btn"
                    type="button"
                    onclick="openAdminMenu('팀 정보')"
                >
                    팀 관리
                </button>

            </div>


            <!-- 선수 -->

            <div class="admin-card">

                <h2>👤 선수 정보</h2>

                <p>
                    선수 정보를 관리합니다.
                </p>

                <button
                    class="menu-btn"
                    type="button"
                    onclick="openAdminMenu('선수 정보')"
                >
                    선수 관리
                </button>

            </div>


            <!-- 사이트 -->

            <div class="admin-card">

                <h2>🌐 CPL 사이트</h2>

                <p>
                    공개된 CPL 홈페이지를 확인합니다.
                </p>

                <button
                    class="menu-btn"
                    type="button"
                    onclick="location.href='index.html'"
                >
                    사이트 열기
                </button>

            </div>

        </div>


        <div class="notice">
            ⚠️ 현재는 관리자 로그인과 메뉴 테스트 단계입니다.
            다음 단계에서 각 메뉴에 실제 수정 기능을 연결합니다.
        </div>

    </div>

</main>


<!-- ★ admin.js 하나만 연결 -->

<script src="admin.js"></script>

</body>
</html>
