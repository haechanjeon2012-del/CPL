<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL 관리자</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-login {
            max-width: 420px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.1);
        }

        .admin-login h1 {
            margin-top: 0;
        }

        .admin-input {
            width: 100%;
            padding: 14px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #071a3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-button:hover {
            opacity: .9;
        }

        .admin-error {
            color: #d32f2f;
            margin-top: 12px;
            display: none;
        }

        #admin-panel {
            display: none;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .admin-card {
            background: white;
            border: 1px solid #e1e5ea;
            border-radius: 14px;
            padding: 25px;
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .admin-card button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 0;
            border-radius: 8px;
            background: #1769e8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-button {
            background: #c62828 !important;
        }

        @media (max-width: 700px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="top-header">

    <div class="logo">
        ⚾ <strong>CPL</strong>
        <span>2026</span>
    </div>

    <div class="league-title">
        🔐 관리자
    </div>

</header>


<!-- =========================
     로그인 화면
========================= -->

<section id="login-screen" class="admin-login">

    <h1>🔐 CPL 관리자 로그인</h1>

    <p>
        관리자만 이용할 수 있습니다.
    </p>

    <input
        id="admin-password"
        class="admin-input"
        type="password"
        placeholder="관리자 비밀번호"
    >

    <button
        class="admin-button"
        onclick="loginAdmin()"
    >
        로그인
    </button>

    <div
        id="login-error"
        class="admin-error"
    >
        비밀번호가 올바르지 않습니다.
    </div>

</section>


<!-- =========================
     관리자 메뉴
========================= -->

<main id="admin-panel">

    <h1>⚾ CPL 관리자 센터</h1>

    <p>
        CPL 사이트의 정보를 관리합니다.
    </p>


    <div class="admin-grid">

        <!-- 경기 -->

        <div class="admin-card">

            <h2>⚾ 경기 결과</h2>

            <p>
                경기 결과와 점수를 수정합니다.
            </p>

            <button onclick="openSection('games')">
                경기 관리
            </button>

        </div>


        <!-- 일정 -->

        <div class="admin-card">

            <h2>📅 일정</h2>

            <p>
                경기 날짜와 대진을 수정합니다.
            </p>

            <button onclick="openSection('schedule')">
                일정 관리
            </button>

        </div>


        <!-- 뉴스 -->

        <div class="admin-card">

            <h2>📰 뉴스</h2>

            <p>
                CPL 뉴스와 공지를 등록합니다.
            </p>

            <button onclick="openSection('news')">
                뉴스 관리
            </button>

        </div>


        <!-- 팀 -->

        <div class="admin-card">

            <h2>👥 팀</h2>

            <p>
                팀 이름과 정보를 수정합니다.
            </p>

            <button onclick="openSection('teams')">
                팀 관리
            </button>

        </div>


        <!-- 선수 -->

        <div class="admin-card">

            <h2>👤 선수</h2>

            <p>
                선수 정보를 수정합니다.
            </p>

            <button onclick="openSection('players')">
                선수 관리
            </button>

        </div>


        <!-- 사이트 -->

        <div class="admin-card">

            <h2>🌐 사이트</h2>

            <p>
                CPL 공개 사이트로 이동합니다.
            </p>

            <button onclick="location.href='index.html'">
                CPL 사이트 열기
            </button>

        </div>

    </div>


    <br>

    <button
        class="admin-button logout-button"
        onclick="logoutAdmin()"
    >
        로그아웃
    </button>

</main>


<script src="admin.js"></script>

</body>
</html>
